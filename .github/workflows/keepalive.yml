name: keepalive

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render instance
        run: |
          curl -s -o /dev/null -w "home:%{http_code}\n" --max-time 90 https://vxcl-ai.onrender.com/
          curl -s -o /dev/null -w "robots:%{http_code}\n" --max-time 30 https://vxcl-ai.onrender.com/robots.txt
